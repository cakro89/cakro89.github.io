<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNETMEDIA - Dashboard OLT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Video Background */
        #video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.3) saturate(1.2);
        }

        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        header {
            margin-top: 60px;
            text-align: center;
            animation: fadeInDown 1s ease both;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        header span {
            color: var(--accent);
            font-size: 0.9rem;
            letter-spacing: 5px;
            display: block;
            margin-top: 10px;
            font-weight: 300;
        }

        /* Menu Grid */
        .menu {
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            z-index: 1;
        }

        .menu a {
            text-decoration: none;
            color: var(--text-color);
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.8s ease both;
        }

        /* Staggered Animation Delay for cards */
        .menu a:nth-child(1) { animation-delay: 0.1s; }
        .menu a:nth-child(2) { animation-delay: 0.2s; }
        .menu a:nth-child(3) { animation-delay: 0.3s; }
        .menu a:nth-child(4) { animation-delay: 0.4s; }
        .menu a:nth-child(5) { animation-delay: 0.5s; }
        .menu a:nth-child(6) { animation-delay: 0.6s; }
        .menu a:nth-child(7) { animation-delay: 0.7s; }
        .menu a:nth-child(8) { animation-delay: 0.8s; }
        .menu a:nth-child(9) { animation-delay: 0.9s; }
        .menu a:nth-child(10) { animation-delay: 1.0s; }

        .menu a:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        .emoji {
            font-size: 2.5rem;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .menu a:hover .emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .brand-text {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .menu { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            header h1 { font-size: 2.2rem; }
            .emoji { font-size: 2rem; }
            .brand-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

        </a>
        <a href="global/">

            <span class="brand-text">GLOBAL</span>
        </a>
        <a href="hsgq/">

            <span class="brand-text">HSGQ</span>
        </a>
        <a href="zymlink/">
            <span class="emoji">⛓️</span>
            <span class="brand-text">ZYMLINK</span>
        </a>
        <a href="joolink/">

        <a href="vsol/">
            <span class="emoji">💡</span>

        </a>
        <a href="hioso/">
            <span class="emoji">💻</span>
            <span class="brand-text">HIOSO</span>
        </a>
        <a href="zte/">

        <a href="hifocus/">

    </div>

    <footer>
        &copy; 2026 <span style="color: var(--accent);">VNETMEDIA</span> • DIGITAL INFRASTRUCTURE
    </footer>

</body>
</html>
