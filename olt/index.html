<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL-OLT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --highlight-color: #40c4ff;
            --card-bg-light: rgba(64, 196, 255, 0.05);
            --card-bg-hover: #40c4ff;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            z-index: 1;
        }

        /* Video Background */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        /* Overlay gelap di atas video */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        header {
            margin-top: 50px;
            text-align: center;
            animation: fadeDown 1s ease-out;
            z-index: 1;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--highlight-color);
            text-shadow: 0 0 10px var(--highlight-color),
                         0 0 20px var(--highlight-color),
                         0 0 40px var(--highlight-color),
                         0 0 80px var(--highlight-color);
            margin: 0;
            letter-spacing: 2px;
        }

        .menu {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            animation: fadeUp 1.2s ease-out;
            z-index: 1;
        }

        .menu a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid var(--highlight-color);
            background: var(--card-bg-light);
            box-shadow: 0 0 15px var(--highlight-color);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu a::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: rgba(64, 196, 255, 0.2);
            transition: 0.4s;
        }

        .menu a:hover::before {
            left: 0;
        }

        .menu a:hover {
            color: var(--bg-color);
            background: var(--card-bg-hover);
            box-shadow: 0 0 30px var(--card-bg-hover);
            transform: translateY(-5px) scale(1.05);
        }

        .menu a span.emoji {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--highlight-color);
        }
        
        /* Tambahan untuk menghilangkan efek glow pada emoji saat hover */
        .menu a:hover span.emoji {
            text-shadow: none;
            color: var(--bg-color);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            text-align: center;
            color: #aaa;
            animation: fadeUp 2s ease-out;
            z-index: 1;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video autoplay muted loop id="video-background">
            <source src="https://static.videezy.com/system/resources/previews/000/036/051/original/Night_city_SSSS.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>

    <header>
        <h1>✨ ALL OLT ✨</h1>
    </header>

    <div class="menu">
        <a href="gpon/">
            <span class="emoji">⚙️</span>
            <span>GPON</span>
        </a>
        <a href="epon/">
            <span class="emoji">🛠️</span>
            <span>EPON</span>
        </a>
    </div>
    
    <footer>
        &copy; 2025 vnetmedia 🚀
    </footer>
    
</body>
</html>
