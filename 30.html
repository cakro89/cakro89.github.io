<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital 30 Juz - Auto Play Beruntun</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d5c3d;
            --secondary-color: #148f5a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --arabic-color: #0b462f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 1.8rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.7rem;
            margin-bottom: 0.2rem;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .nav-section {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }

        select {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }

        .ayat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ayat-card.playing {
            border: 2px solid var(--secondary-color);
            background-color: #f0f9f4;
        }

        .ayat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .ayat-number {
            background: var(--primary-color);
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-play {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }

        .btn-play:hover {
            background-color: var(--secondary-color);
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: right;
            color: var(--arabic-color);
            margin-bottom: 1rem;
            line-height: 2.3;
            direction: rtl;
        }

        .translation-text {
            font-size: 0.95rem;
            color: #555;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .arabic-text {
                font-size: 1.6rem;
                line-height: 2;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Al-Qur'an Digital 30 Juz</h1>
        <p>Dilengkapi Auto-Play Beruntun Antar Ayat</p>
    </header>

    <div class="container">
        <div class="nav-section">
            <select id="daftar-surat" onchange="gantiSurat(this.value)">
                <option value="">Memuat Daftar Surat...</option>
            </select>
        </div>

        <div id="quran-container">
            <div class="loading">Silakan pilih surat di atas untuk membaca Al-Qur'an.</div>
        </div>
    </div>

    <audio id="audio-player" style="display: none;"></audio>

    <script>
        let currentAudio = document.getElementById('audio-player');
        let activeIndex = null;
        let daftarAyatData = []; // Menyimpan data ayat aktif saat ini

        async function loadDaftarSurat() {
            try {
                const response = await fetch('https://equran.id/api/v2/surat');
                const result = await response.json();
                
                if (result.code === 200) {
                    const select = document.getElementById('daftar-surat');
                    select.innerHTML = '<option value="">-- Pilih Surat (1 - 114) --</option>';
                    
                    result.data.forEach(surat => {
                        const opt = document.createElement('option');
                        opt.value = surat.nomor;
                        opt.textContent = `${surat.nomor}. ${surat.namaLatin} (${surat.arti}) - ${surat.jumlahAyat} Ayat`;
                        select.appendChild(opt);
                    });

                    select.value = "1";
                    muatAyatSurat(1);
                }
            } catch (err) {
                console.error("Gagal memuat daftar surat:", err);
            }
        }

        function gantiSurat(nomorSurat) {
            if (nomorSurat) {
                muatAyatSurat(nomorSurat);
            }
        }

        async function muatAyatSurat(nomor) {
            const container = document.getElementById('quran-container');
            container.innerHTML = '<div class="loading">Memuat ayat...</div>';

            currentAudio.pause();
            resetActiveCard();

            try {
                const response = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
                const result = await response.json();

                if (result.code === 200) {
                    const data = result.data;
                    daftarAyatData = data.ayat; // Simpan array ayat untuk navigasi auto-play
                    container.innerHTML = '';

                    const infoCard = document.createElement('div');
                    infoCard.style.cssText = "background: var(--primary-color); color: white; padding: 1.2rem; border-radius: 12px; margin-bottom: 1rem; text-align: center;";
                    infoCard.innerHTML = `
                        <h2 style="font-family: 'Amiri', serif; font-size: 1.8rem; margin-bottom: 0.2rem;">${data.nama}</h2>
                        <p style="font-size: 1rem; font-weight: 600;">${data.namaLatin} (${data.arti})</p>
                        <p style="font-size: 0.85rem; opacity: 0.9; margin-top: 5px;">Turun di ${data.tempatTurun} • ${data.jumlahAyat} Ayat</p>
                    `;
                    container.appendChild(infoCard);

                    data.ayat.forEach((ayat, index) => {
                        const card = document.createElement('div');
                        card.className = 'ayat-card';
                        card.id = `card-${index}`;

                        const audioUrl = ayat.audio['01'] || '';

                        card.innerHTML = `
                            <div class="ayat-header">
                                <span class="ayat-number">${ayat.nomorAyat}</span>
                                <button class="btn-play" id="btn-${index}" onclick="playAudioByIndex(${index})">
                                    ▶ Putar
                                </button>
                            </div>
                            <div class="arabic-text">${ayat.teksArab}</div>
                            <div class="translation-text"><strong>Artinya:</strong> ${ayat.teksIndonesia}</div>
                        `;

                        container.appendChild(card);
                    });
                }
            } catch (err) {
                console.error("Gagal memuat ayat:", err);
                container.innerHTML = '<div class="error-msg">Gagal memuat isi ayat. Periksa koneksi internet Anda.</div>';
            }
        }

        function playAudioByIndex(index) {
            // Jika diklik pada ayat yang sedang diputar, lakukan pause
            if (!currentAudio.paused && activeIndex === index) {
                currentAudio.pause();
                resetActiveCard();
                return;
            }

            resetActiveCard();
            activeIndex = index;

            const ayat = daftarAyatData[index];
            if (!ayat) return;

            const audioUrl = ayat.audio['01'];
            currentAudio.src = audioUrl;

            // Beri tanda visual pada kartu yang sedang aktif
            const currentCard = document.getElementById(`card-${index}`);
            const currentBtn = document.getElementById(`btn-${index}`);
            if (currentCard && currentBtn) {
                currentCard.classList.add('playing');
                currentBtn.innerHTML = '⏸ Jeda';
                // Otomatis gulir (scroll) layar ke ayat yang sedang diputar agar posisinya pas
                currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            currentAudio.play().catch(err => console.error("Gagal memutar audio:", err));

            // EVENT: Ketika audio ayat ini selesai, otomatis lanjut ke indeks berikutnya
            currentAudio.onended = function() {
                resetActiveCard();
                let nextIndex = index + 1;
                if (nextIndex < daftarAyatData.length) {
                    playAudioByIndex(nextIndex); // Panggil rekursif ke ayat berikutnya
                }
            };
        }

        function resetActiveCard() {
            if (activeIndex !== null) {
                const prevCard = document.getElementById(`card-${activeIndex}`);
                const prevBtn = document.getElementById(`btn-${activeIndex}`);
                if (prevCard) prevCard.classList.remove('playing');
                if (prevBtn) prevBtn.innerHTML = '▶ Putar';
                activeIndex = null;
            }
        }

        loadDaftarSurat();
    </script>
</body>
</html>
