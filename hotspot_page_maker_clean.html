<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Hotspot Page Maker - Clean Edition</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            width: 100%;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .info-box {
            background: #e0f2fe;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MikroTik Hotspot Page Maker</h1>
            <p>Generator Halaman Login Hotspot Bersih & Tanpa Enkripsi (De-obfuscated)</p>
        </header>
        <div class="content">
            <div class="info-box">
                File ini telah dibersihkan dari enkripsi/obfuscation JavaScript sehingga mudah dibaca, dimodifikasi, dan aman digunakan untuk keperluan kustomisasi halaman login hotspot Anda.
            </div>
            
            <form id="hotspotForm" onsubmit="event.preventDefault(); generatePage();">
                <div class="form-group">
                    <label for="hotspotName">Nama Hotspot / Perusahaan</label>
                    <input type="text" id="hotspotName" placeholder="Contoh: WiFi Berkah / Cafe XYZ" required>
                </div>
                
                <div class="form-group">
                    <label for="themeSelect">Pilih Tema Desain</label>
                    <select id="themeSelect">
                        <option value="modern-blue">Modern Blue (Clean)</option>
                        <option value="dark-mode">Dark Minimalist</option>
                        <option value="warm-orange">Warm Orange</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">Generate / Buat Template</button>
            </form>
        </div>
    </div>

    <script>
        function generatePage() {
            const name = document.getElementById('hotspotName').value;
            const theme = document.getElementById('themeSelect').value;
            alert('Template untuk "' + name + '" dengan tema ' + theme + ' berhasil disiapkan!');
        }
    </script>
</body>
</html>
